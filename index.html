<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Bebidas - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="login-container">
        <div class="login-box">
            <div class="logo">🍹</div>
            <h1>Tienda de Bebidas</h1>
            <p class="subtitle">Iniciá sesión para continuar</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-user">Usuario</label>
                    <input type="text" id="login-user" placeholder="Tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="login-pass">Contraseña</label>
                    <input type="password" id="login-pass" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn-primary full-width">Entrar</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

<script type="module" src="login.js?v=2"></script></body>
</html>
