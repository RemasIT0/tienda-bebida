<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Tienda de Bebidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <header class="admin-header">
        <div class="header-content">
            <h1>🍹 Panel de Administración</h1>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>
    </header>

    <main class="admin-main">
        <!-- Gestión de Productos -->
        <section class="card">
            <div class="card-header">
                <h2>Mis Productos</h2>
                <button class="btn-primary" onclick="openProductForm()">+ Nuevo producto</button>
            </div>
            <div id="admin-products" class="product-grid">
                <!-- Se llena con JS -->
            </div>
        </section>

        <!-- Pedidos Pendientes -->
        <section class="card">
            <h2>Pedidos Pendientes</h2>
            <div id="admin-pending-orders">
                <!-- Se llena con JS -->
            </div>
        </section>

        <!-- Gestión de Clientes -->
        <section class="card">
            <div class="card-header">
                <h2>Clientes</h2>
                <button class="btn-primary" onclick="openClientForm()">+ Nuevo cliente</button>
            </div>
            <div id="admin-clients" class="clients-list">
                <!-- Se llena con JS -->
            </div>
        </section>
    </main>

    <!-- Modal: Formulario Producto -->
    <div id="modal-product" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modal-product-title">Nuevo producto</h2>
                <button class="btn-close" onclick="closeModal('modal-product')">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="prod-id">

                <div class="form-group">
                    <label for="prod-name">Nombre</label>
                    <input type="text" id="prod-name" placeholder="Ej: Coca Cola 500ml" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-price">Precio</label>
                        <input type="number" id="prod-price" step="0.01" min="0" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="prod-stock">Stock</label>
                        <input type="number" id="prod-stock" min="0" placeholder="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="prod-desc">Descripción</label>
                    <textarea id="prod-desc" rows="3" placeholder="Descripción breve del producto..."></textarea>
                </div>

                <div class="form-group">
                    <label for="prod-img">Imagen</label>
                    <input type="file" id="prod-img" accept="image/*">
                    <img id="prod-img-preview" class="img-preview" alt="Vista previa">
                </div>

                <button type="submit" class="btn-primary full-width">Guardar</button>
            </form>
        </div>
    </div>

    <!-- Modal: Formulario Cliente -->
    <div id="modal-client" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modal-client-title">Nuevo cliente</h2>
                <button class="btn-close" onclick="closeModal('modal-client')">&times;</button>
            </div>
            <form id="client-form">
                <input type="hidden" id="client-id">

                <div class="form-group">
                    <label for="client-name">Nombre completo</label>
                    <input type="text" id="client-name" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="client-user">Usuario</label>
                    <input type="text" id="client-user" placeholder="usuario123" required>
                </div>

                <div class="form-group">
                    <label for="client-pass">Contraseña</label>
                    <input type="text" id="client-pass" placeholder="contraseña" required>
                </div>

                <button type="submit" class="btn-primary full-width">Guardar</button>
            </form>
        </div>
    </div>

<script type="module" src="admin.js?v=2"></script></body>
</html>
